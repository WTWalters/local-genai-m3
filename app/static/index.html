<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthopedics EMR RAG System</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <div class="medical-header">
                    <i class="fas fa-stethoscope"></i>
                    <h1>Orthopedics EMR</h1>
                    <p>HIPAA-Compliant Medical Information System</p>
                </div>
                
                <div class="login-form">
                    <h2>Sign In</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn-primary">Sign In</button>
                    </form>
                    
                    <div class="demo-section">
                        <h3>Demo Roles</h3>
                        <p>For POC demonstration, try these roles:</p>
                        <div class="demo-buttons">
                            <button class="btn-demo" data-role="admin">Admin Dashboard</button>
                            <button class="btn-demo" data-role="attending_physician">Attending Physician</button>
                            <button class="btn-demo" data-role="resident">Resident</button>
                            <button class="btn-demo" data-role="nurse">Nurse</button>
                            <button class="btn-demo" data-role="read_only">Read-Only</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="screen">
            <nav class="navbar">
                <div class="nav-brand">
                    <i class="fas fa-stethoscope"></i>
                    <span>Orthopedics EMR</span>
                </div>
                
                <div class="nav-user">
                    <span id="currentUser">Loading...</span>
                    <span id="currentRole" class="role-badge">Loading...</span>
                    <button id="logoutBtn" class="btn-logout">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </nav>

            <div class="dashboard-container">
                <aside class="sidebar">
                    <div class="sidebar-menu" id="sidebarMenu">
                        <!-- Dynamic menu based on role -->
                    </div>
                </aside>

                <main class="main-content">
                    <div class="content-header">
                        <h1 id="contentTitle">Dashboard</h1>
                        <div class="breadcrumb" id="breadcrumb">
                            <span>Home</span>
                        </div>
                    </div>

                    <div class="content-area" id="contentArea">
                        <!-- Dynamic content based on selected menu -->
                        <div class="welcome-panel">
                            <h2>Welcome to Orthopedics EMR</h2>
                            <p>Select an option from the menu to get started.</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loadingScreen" class="screen">
            <div class="loading-container">
                <div class="loading-spinner">
                    <i class="fas fa-stethoscope fa-spin"></i>
                </div>
                <p>Loading your medical dashboard...</p>
            </div>
        </div>

        <!-- Error Messages -->
        <div id="errorToast" class="toast error-toast">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMessage"></span>
            <button class="toast-close">&times;</button>
        </div>

        <!-- Success Messages -->
        <div id="successToast" class="toast success-toast">
            <i class="fas fa-check-circle"></i>
            <span id="successMessage"></span>
            <button class="toast-close">&times;</button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
